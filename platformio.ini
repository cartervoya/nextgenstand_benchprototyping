; PlatformIO project configuration for the NextGen Stand bench prototype.
;
;   pio run                     build the firmware
;   pio run -t upload           build and flash a connected Teensy 4.1
;   pio test -e teensy41        run the C unit tests ON the board (needs hardware)
;   pio run -t compiledb        regenerate compile_commands.json for clangd
;
; On Windows, run these through the project venv (`.\.venv\Scripts\pio.exe`)
; or activate it first -- pio is installed there, not globally.
;
; The C tests run on-target rather than natively: this machine has no host C
; compiler, and running them on the real Cortex-M7 also catches the alignment
; and endianness assumptions that a native x86 build would paper over.

[platformio]
name = nextgenstand_benchprototyping
description = Teensy 4.1 bench firmware and Python host for NextGen Stand prototyping
default_envs = teensy41

; Firmware lives under firmware/ so the Python host can own the repo root
; alongside it without the two trees colliding.
;
; The whole pure-C layer is a local library at firmware/lib/ngs rather than
; loose files in src/. That is what lets `pio test` link the protocol code
; without also pulling in main.cpp -- src/ holds only the Arduino entry point,
; so the Unity runner can own setup()/loop() without a duplicate-symbol clash.
src_dir = firmware/src
lib_dir = firmware/lib
test_dir = firmware/test

[env:teensy41]
; Pinned so a fresh clone reproduces this exact toolchain. Bump deliberately.
platform = teensy@5.2.0
board = teensy41
framework = arduino

; build_flags reaches EVERYTHING, including the Teensy core, so it holds only
; defines. Two things deliberately do not live here:
;
;   -std=...  PlatformIO funnels build_flags into SCons CCFLAGS, shared by gcc
;             and g++, so -std=gnu11 would be passed to g++ and rejected. The
;             teensy platform already defaults to gnu11 / gnu++17.
;   warnings  Applied to the core they produce hundreds of lines of noise that
;             hide our own. They are scoped to our code instead: build_src_flags
;             below for main.cpp, and firmware/lib/ngs/library.json for the C
;             layer -- which, being all .c, can also carry C-only -Werror flags.
build_flags =
    ; USB CDC serial. This is the Teensyduino default, stated explicitly so a
    ; future HID or MIDI experiment cannot silently change the host contract.
    -DUSB_SERIAL
    ; Firmware version reported by NGS_MSG_GET_INFO.
    -DNGS_FW_VERSION_MAJOR=0
    -DNGS_FW_VERSION_MINOR=1
    -DNGS_FW_VERSION_PATCH=0

; src_dir only, i.e. main.cpp. C++ only, so no C-specific flags here.
build_src_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

; Baud is ignored by Teensy USB CDC; set for tools that require a value.
monitor_speed = 115200
monitor_filters = time, colorize

; Leave test_build_src off (the default): the tests link firmware/lib/ngs and
; supply their own ngs_board_* fake, so main.cpp must stay out of the test
; binary or its setup()/loop() would collide with the Unity runner's.
lib_deps = ngs
